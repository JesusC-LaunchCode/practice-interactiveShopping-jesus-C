<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Interactive Shopping List</h1>
    <form>
        <label for="item-input">Shopping Item:</label>
        <input type="text" id="item-input" name="item-input" placeholder="Add a new item">
        <button id="add-button">Add Item</button>
    </form>
    <br>
    <h2>Shopping list:</h2>
    <ul id="shopping-list">
    </ul>

    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <input type="text" id="edit-input" name="edit-input" placeholder="Edit item">
            <button id="submit-edit">Submit</button>
        </div>
    </div>
</body>
</html>
